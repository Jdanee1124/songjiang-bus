<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="松江通勤">
  <meta name="theme-color" content="#0f172a">
  <title>松江通勤实时决策看板</title>
  
  <!-- Apple Touch Icon for Home Screen -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><path d='M28 25 C28 20, 72 20, 72 25 L72 65 C72 70, 28 70, 28 65 Z' fill='%23ffffff'/><rect x='33' y='28' width='34' height='18' rx='4' fill='%232563eb'/><circle cx='38' cy='58' r='4' fill='%232563eb'/><circle cx='62' cy='58' r='4' fill='%232563eb'/><rect x='34' y='69' width='7' height='7' rx='2' fill='%23ffffff'/><rect x='59' y='69' width='7' height='7' rx='2' fill='%23ffffff'/></svg>">

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 46, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Nav Segmented Control */
    .header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 10px;
    }

    .app-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .refresh-badge {
      font-size: 12px;
      color: var(--text-sub);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .refresh-icon {
      display: inline-block;
      transition: transform 0.5s ease;
    }
    .rotating {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .mode-switch {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 4px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 15px;
      font-weight: 600;
      padding: 10px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }

    /* Real-time Weather Panel */
    .weather-panel {
      background: rgba(22, 30, 46, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .weather-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .weather-icon {
      font-size: 32px;
      line-height: 1;
    }

    .weather-temp-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .weather-temp {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
    }

    .weather-tag {
      font-size: 13px;
      font-weight: 600;
      color: #93c5fd;
    }

    .weather-sub {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 3px;
    }

    .weather-right {
      display: flex;
      gap: 14px;
    }

    .weather-metric {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .metric-label {
      font-size: 10px;
      color: #9ca3af;
      letter-spacing: 0.3px;
    }

    .metric-val {
      font-size: 13px;
      font-weight: 700;
      color: #e5e7eb;
    }

    .metric-val.rain-alert {
      color: #38bdf8;
      font-weight: 800;
    }

    /* AI Recommendation Banner */
    .ai-banner {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.2) 0%, rgba(16, 185, 129, 0.2) 100%);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 16px;
      padding: 14px 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .ai-banner-icon {
      font-size: 22px;
      line-height: 1;
    }

    .ai-banner-text {
      flex: 1;
    }

    .ai-banner-title {
      font-size: 14px;
      font-weight: 700;
      color: #93c5fd;
      margin-bottom: 2px;
    }

    .ai-banner-desc {
      font-size: 13px;
      color: #e5e7eb;
      line-height: 1.4;
    }

    /* Route Cards */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .route-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .route-card.highlight {
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.15);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .route-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .line-title {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
    }

    .route-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
    }

    .decision-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ETA Display Area */
    .eta-box {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 10px 0 6px;
    }

    .eta-number {
      font-size: 46px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .eta-unit {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .eta-detail {
      font-size: 14px;
      color: var(--text-sub);
      margin-left: 6px;
    }

    .eta-waiting {
      font-size: 22px;
      font-weight: 700;
      color: var(--warning);
      padding: 10px 0;
    }

    /* Smart Tip */
    .decision-tip {
      font-size: 13px;
      line-height: 1.45;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      margin: 10px 0 14px;
      color: #d1d5db;
    }

    /* Sub Details */
    .route-meta {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 12px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meta-label {
      color: #6b7280;
    }

    .meta-value {
      color: #e5e7eb;
      font-weight: 500;
    }

    /* Bottom Tip */
    .footer {
      text-align: center;
      font-size: 12px;
      color: #4b5563;
      padding: 16px 0 8px;
      line-height: 1.6;
    }

    /* Loading overlay */
    .loading-shimmer {
      opacity: 0.6;
      filter: blur(1px);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="app-title-row">
        <div class="app-title">
          <span>🚌</span> 松江通勤对比
        </div>
        <div class="refresh-badge" id="refreshBtn" onclick="manualRefresh()">
          <span class="refresh-icon" id="refreshIcon">↻</span>
          <span id="updateTimer">实时</span>
        </div>
      </div>

      <!-- Segmented Switch: Evening vs Morning -->
      <div class="mode-switch">
        <button class="mode-btn active" id="btnEvening" onclick="switchMode('evening')">
          🏢 下班回家
        </button>
        <button class="mode-btn" id="btnMorning" onclick="switchMode('morning')">
          ☀️ 早晨上班
        </button>
      </div>
    </div>

    <!-- Real-time Songjiang Weather Panel -->
    <div class="weather-panel" id="weatherPanel">
      <div class="weather-left">
        <span class="weather-icon" id="weatherIcon">⛅</span>
        <div>
          <div class="weather-temp-row">
            <span class="weather-temp" id="weatherTemp">--°</span>
            <span class="weather-tag" id="weatherTag">松江 · 获取中</span>
          </div>
          <div class="weather-sub" id="weatherSub">实时气象数据接入中...</div>
        </div>
      </div>
      <div class="weather-right">
        <div class="weather-metric">
          <span class="metric-label">降水实况</span>
          <span class="metric-val" id="weatherRain">--</span>
        </div>
        <div class="weather-metric">
          <span class="metric-label">风况</span>
          <span class="metric-val" id="weatherWind">--</span>
        </div>
      </div>
    </div>

    <!-- AI Recommendation -->
    <div class="ai-banner" id="aiBanner">
      <div class="ai-banner-icon">⚡</div>
      <div class="ai-banner-text">
        <div class="ai-banner-title" id="aiTitle">实时测算中...</div>
        <div class="ai-banner-desc" id="aiDesc">正在拉取松莘B线与松江40路卫星定位...</div>
      </div>
    </div>

    <!-- Cards Container -->
    <div class="card-list" id="cardList">
      <!-- Skeleton Cards -->
      <div class="route-card">
        <div class="card-top">
          <div class="line-title">加载中...</div>
        </div>
        <div class="eta-box">
          <div class="eta-number" style="color:#6b7280">--</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div>💡 提示：在 Safari 点击下方「分享」➜「添加到主屏幕」即可秒开</div>
      <div>松江区实时公交专线 · 无广告 · 20秒自动同步</div>
    </div>
  </div>

  <script>
    let currentMode = 'evening';
    let autoRefreshTimer = null;
    let countdownSec = 20;

    // Detect time on load: before 12:00 -> morning, after 12:00 -> evening
    const hour = new Date().getHours();
    if (hour < 12) {
      currentMode = 'morning';
      document.getElementById('btnMorning').classList.add('active');
      document.getElementById('btnEvening').classList.remove('active');
    }

    function switchMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;
      document.getElementById('btnEvening').classList.toggle('active', mode === 'evening');
      document.getElementById('btnMorning').classList.toggle('active', mode === 'morning');
      fetchData();
    }

    async function fetchData() {
      const cardList = document.getElementById('cardList');
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('rotating');

      try {
        const res = await fetch(`/api/transit?mode=${currentMode}&t=${Date.now()}`);
        const data = await res.json();
        renderData(data);
      } catch (e) {
        document.getElementById('aiTitle').innerText = '网络连接提示';
        document.getElementById('aiDesc').innerText = '获取实时位置超时，请检查网络或点击右上角刷新。';
      } finally {
        refreshIcon.classList.remove('rotating');
        countdownSec = 20;
      }
    }

    function renderData(data) {
      if (!data) return;
      const { title, options, weather } = data;
      const cardList = document.getElementById('cardList');

      // Update Weather Panel
      if (weather) {
        document.getElementById('weatherIcon').innerText = weather.weatherIcon || '⛅';
        document.getElementById('weatherTemp').innerText = `${weather.temperature ?? '--'}°`;
        document.getElementById('weatherTag').innerText = `松江 · ${weather.weatherText || '实时'}`;
        document.getElementById('weatherSub').innerText = `体感 ${weather.apparentTemperature ?? '--'}° · 湿度 ${weather.humidity ?? '--'}%`;
        
        const rainEl = document.getElementById('weatherRain');
        if (weather.isRaining) {
          rainEl.innerText = `${weather.precipitation > 0 ? weather.precipitation + 'mm' : '有降雨'}`;
          rainEl.classList.add('rain-alert');
        } else {
          rainEl.innerText = '无降雨';
          rainEl.classList.remove('rain-alert');
        }

        document.getElementById('weatherWind').innerText = `${weather.windDesc || '微风'}`;
      }

      if (!options || !Array.isArray(options) || options.length === 0) {
        return;
      }

      cardList.innerHTML = '';
      let bestOption = null;
      const isRaining = weather && weather.isRaining;

      options.forEach((opt, idx) => {
        const card = document.createElement('div');
        card.className = 'route-card';

        const optId = opt.id || opt.optionId || (idx === 0 ? 'songxin_b' : 'songjiang_40');
        const lineName = opt.lineName || (optId.includes('songxin') ? '松莘B线' : '松江40路');
        const badge = opt.badge || (idx === 0 ? '直达一趟车' : '楼下近 / 需换乘');
        const stopName = opt.stopName || (optId.includes('songxin') ? '莘砖公路千帆路' : '中心路云凯路');
        const destStopName = opt.destStopName || (optId.includes('songxin') ? '嘉松南路梅家浜路' : '九亭地铁站');
        const totalTripTime = opt.totalTripTime || (idx === 0 ? '~50分钟 (直达)' : '~40分钟');

        const dec = opt.decision || {
          level: 'wait',
          tag: '运行中',
          tip: '正在同步公交调度中心实时定位...',
          color: '#3b82f6'
        };
        const next = opt.nextBus;

        // Check if this option is recommended (if raining, strongly favor opt 2)
        if (isRaining) {
          if (idx === 1) card.classList.add('highlight');
        } else {
          if (dec.level === 'perfect' && !bestOption) {
            bestOption = opt;
            card.classList.add('highlight');
          }
        }

        let etaHtml = '';
        if (next && !next.isScheduled) {
          etaHtml = `
            <div class="eta-box">
              <span class="eta-number" style="color: ${dec.color || '#10b981'}">${next.etaMinutes}</span>
              <span class="eta-unit">分钟</span>
              <span class="eta-detail">还有 ${next.stopsAway} 站 ${next.distanceMeters ? `· ${(next.distanceMeters / 1000).toFixed(1)}km` : ''}</span>
            </div>
          `;
        } else if (next && next.isScheduled) {
          etaHtml = `
            <div class="eta-box">
              <span class="eta-number" style="color: ${dec.color || '#f59e0b'}">${next.etaMinutes !== null ? '~' + next.etaMinutes : (next.preArrivalTime || '--')}</span>
              <span class="eta-unit">${next.etaMinutes !== null ? '分钟' : ''}</span>
              <span class="eta-detail" style="color: #fbbf24">⏳ 下一班预计 ${next.preStartTime ? next.preStartTime + ' 发车' : ''} ${next.preArrivalTime ? '· ' + next.preArrivalTime + ' 到站' : ''}</span>
            </div>
          `;
        } else {
          etaHtml = `
            <div class="eta-waiting">
              ${opt.depDesc || (opt.success === false ? '📡 卫星信号同步中...' : '暂无发车调度计划')}
            </div>
          `;
        }

        // Special weather notice for bike route
        let bikeRainNotice = '';
        if (isRaining && optId.includes('songxin_b')) {
          bikeRainNotice = `
            <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; margin-bottom: 8px;">
              🌧️ 当前松江有雨，路面湿滑，不建议 1.5km 骑行！
            </div>
          `;
        }

        card.innerHTML = `
          <div class="card-top">
            <div class="route-header">
              <span class="line-title">${lineName}</span>
              <span class="route-tag">${badge}</span>
            </div>
            <div class="decision-badge" style="background: ${isRaining && optId.includes('songxin_b') ? '#ef4444' : (dec.color || '#3b82f6')}">
              ${isRaining && optId.includes('songxin_b') ? '雨天不建议' : (dec.tag || '运行中')}
            </div>
          </div>

          ${bikeRainNotice}
          ${etaHtml}

          <div class="decision-tip">
            ${dec.tip || '实时调度数据正在更新...'}
          </div>

          <div class="route-meta">
            <div class="meta-row">
              <span class="meta-label">上车站</span>
              <span class="meta-value">${stopName}</span>
            </div>
            <div class="meta-row">
              <span class="meta-label">目的地</span>
              <span class="meta-value">${destStopName}</span>
            </div>
            <div class="meta-row">
              <span class="meta-label">出行耗时</span>
              <span class="meta-value">${totalTripTime}</span>
            </div>
            ${opt.scheduledDeparture && opt.scheduledDeparture.preStartTime ? `
              <div class="meta-row" style="color: #fbbf24;">
                <span class="meta-label">下一班发车</span>
                <span class="meta-value">${opt.scheduledDeparture.preStartTime}（${opt.scheduledDeparture.minutesToStart != null ? '约 ' + opt.scheduledDeparture.minutesToStart + ' 分钟后' : '近期'}）</span>
              </div>
            ` : ''}
            ${opt.depDesc ? `
              <div class="meta-row" style="color: #9ca3af;">
                <span class="meta-label">上一班动态</span>
                <span class="meta-value">${opt.depDesc}</span>
              </div>
            ` : ''}
            ${opt.secondBus ? `
              <div class="meta-row" style="color: #9ca3af; margin-top:2px;">
                <span class="meta-label">再下一班</span>
                <span class="meta-value">约 ${opt.secondBus.etaMinutes} 分钟后（还有 ${opt.secondBus.stopsAway} 站）</span>
              </div>
            ` : ''}
          </div>
        `;

        cardList.appendChild(card);
      });

      // Update AI Banner
      const aiTitle = document.getElementById('aiTitle');
      const aiDesc = document.getElementById('aiDesc');

      if (options.length >= 2) {
        const o1 = options[0];
        const o2 = options[1];
        const o1Line = o1.lineName || '松莘B线';
        const o2Line = o2.lineName || '松江40路';
        const o1Dec = o1.decision || {};
        const o2Dec = o2.decision || {};

        if (isRaining) {
          aiTitle.innerText = `🌧️ 松江天气：${weather?.weatherText || '有雨'} · 降雨量 ${weather?.precipitation || 0}mm`;
          if (currentMode === 'morning') {
            aiDesc.innerText = `路面湿滑且有雨！强烈推荐乘【地铁9号线 ➔ ${o2Line}】，下车直接进公司，避免雨中骑行 1.5km 淋雨！`;
          } else {
            aiDesc.innerText = `路面湿滑且在下雨！强烈建议放弃方案一（1.5km 骑行），直接走楼下【${o2Line} ➔ 地铁9号线】更稳妥安全！`;
          }
        } else if (currentMode === 'morning') {
          if (o1Dec.level === 'perfect') {
            aiTitle.innerText = `💡 早晨推荐：优先走【${o1Line}】`;
            aiDesc.innerText = `${o1Line} 预计 ${o1.nextBus?.etaMinutes || 5} 分钟后到达梅家浜路站，现在穿鞋出门到站刚好无缝上车！一趟直达漕河泾。`;
          } else if (o1Dec.level === 'missed') {
            aiTitle.innerText = `💡 早晨推荐：走【地铁9号线 ➔ ${o2Line}】`;
            aiDesc.innerText = `${o1Line} 刚刚进站已来不及出门，建议乘地铁9号线到九亭换乘松江40路更稳妥！`;
          } else {
            aiTitle.innerText = `💡 早晨通勤提示`;
            aiDesc.innerText = `${o1Line} 预计还有 ${o1.nextBus ? o1.nextBus.etaMinutes + '分钟' : (o1.depDesc || '等发车')}；地铁九亭站 ${o2Line} 预计 ${o2.nextBus ? o2.nextBus.etaMinutes + '分钟' : (o2.depDesc || '等发车')}。请合理安排出门时间！`;
          }
        } else {
          if (o1Dec.level === 'perfect') {
            aiTitle.innerText = `💡 下班推荐：优先走【${o1Line}】`;
            aiDesc.innerText = `${o1Line} 预计 ${o1.nextBus?.etaMinutes || 8} 分钟后到达，骑行 1.5km 约 6 分钟，现在扫车出发刚好直接上车！一趟车直达！`;
          } else if (o1Dec.level === 'missed' && o2Dec.level !== 'missed') {
            aiTitle.innerText = `💡 下班推荐：走楼下【${o2Line} + 地铁】`;
            aiDesc.innerText = `${o1Line} 即将进站已赶不上，不要冒险狂奔！直接下楼坐 ${o2Line} 去九亭换地铁更稳妥。`;
          } else if (o2.nextBus && o2.nextBus.etaMinutes <= 5) {
            aiTitle.innerText = `💡 下班推荐：下楼坐【${o2Line}】`;
            aiDesc.innerText = `楼下 ${o2Line} 还有 ${o2.nextBus.etaMinutes} 分钟进站，立即下楼就能坐上！`;
          } else {
            aiTitle.innerText = `💡 下班通勤提示`;
            aiDesc.innerText = `${o1Line} 预计还有 ${o1.nextBus ? o1.nextBus.etaMinutes + '分钟' : (o1.depDesc || '等发车')}；${o2Line} 预计 ${o2.nextBus ? o2.nextBus.etaMinutes + '分钟' : (o2.depDesc || '等发车')}。请根据工位与骑车用时合理选择！`;
          }
        }
      }
    }

    function manualRefresh() {
      fetchData();
    }

    // Auto timer
    setInterval(() => {
      countdownSec--;
      const updateTimer = document.getElementById('updateTimer');
      if (countdownSec <= 0) {
        countdownSec = 20;
        fetchData();
      } else {
        updateTimer.innerText = `${countdownSec}s`;
      }
    }, 1000);

    // Initial load
    fetchData();
  </script>
</body>
</html>
